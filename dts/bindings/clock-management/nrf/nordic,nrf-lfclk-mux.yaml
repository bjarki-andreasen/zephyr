compatible: "nordic,nrf-lfclk-mux"

description: Nordic nRF LFCLK clock mux

include: [clock-node.yaml]

properties:
  input-sources:
    type: phandles
    required: true
    description: |
      List of all input sources provided to the multiplexer. These sources
      should be references to other clock nodes within the clock tree.

  "#clock-cells":
    const: 1

clock-cells:
  - mux
